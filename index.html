    <script>
      // Shim to ensure window.fetch is writable if an interceptor/polyfill assigns to it
      (function () {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch ? originalFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch || (originalFetch ? originalFetch.bind(window) : undefined);
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
